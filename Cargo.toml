[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/pixelgrab-contracts",
    "crates/pixelgrab-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["PixelGrab Contributors"]
repository = "https://github.com/alondero/pixelgrab"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.20"
indexmap = { version = "2.7", features = ["serde"] }

# Tauri 2 stack
tauri = { version = "2.2", features = ["tray-icon", "protocol-asset"] }
tauri-build = { version = "2.0", features = [] }
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-single-instance = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-clipboard-manager = "2.2"

# Image processing
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

# Local
pixelgrab-contracts = { path = "crates/pixelgrab-contracts" }
pixelgrab-test-support = { path = "crates/pixelgrab-test-support" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
