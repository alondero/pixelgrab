name: PixelGrab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs targeting the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 1
  PNPM_VERSION: 9.15.0
  # Force LF checkouts so all tools (cargo fmt, prettier, svelte-check)
  # see the same bytes regardless of whether the runner is on Windows or
  # Linux. .gitattributes already enforces eol=lf but the actions/checkout
  # step on Windows still defaults to CRLF unless we explicitly opt out.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.autocrlf"
  GIT_CONFIG_VALUE_0: "false"

jobs:
  install:
    name: Install (frozen)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            ${{ runner.os }}-cargo-
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  rust:
    name: Rust (fmt, clippy, test)
    needs: [install]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            ${{ runner.os }}-cargo-
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features synthetic -- -D warnings
      - name: Test
        run: cargo test --workspace --features synthetic

  frontend:
    name: Frontend (lint, typecheck, test)
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm exec eslint .
      - name: Type check
        run: pnpm check
      - name: Agent infrastructure
        run: pnpm agents:check
      - name: Test
        run: pnpm test
      - name: License policy
        run: pnpm licenses:check
      - name: Dependency audit
        # Fails the build if any dependency has a known moderate or higher
        # advisory. The audit data is fetched from the GitHub Advisory
        # Database via `pnpm audit --audit-level=moderate`.
        run: pnpm audit --audit-level=moderate

  build:
    name: Build (production)
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            ${{ runner.os }}-cargo-
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        # Production defaults select real Windows capture and OS hotkeys.
        # Keep synthetic explicit in tests only.
        run: pnpm exec tauri build --no-bundle
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelgrab-build
          path: |
            target/release/pixelgrab.exe
            target/release/pixelgrab_lib.lib
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    # Startup survival only; does not run tests/e2e or prove capture workflows.
    # Do not trigger real desktop capture in this production-binary job.
    name: Packaged-app smoke test
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pixelgrab-build
          path: dist-build
      - name: Verify binary exists
        shell: pwsh
        run: |
          $binary = "dist-build/pixelgrab.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "Expected binary not found at $binary"
            exit 1
          }
          $size = (Get-Item $binary).Length
          Write-Host "Binary: $binary"
          Write-Host "Size:   $size bytes"
          if ($size -lt 1000000) {
            Write-Error "Binary is suspiciously small ($size bytes)"
            exit 1
          }
          Write-Host "Binary size is reasonable - smoke test passed."
      - name: Launch smoke test
        shell: pwsh
        run: |
          # Tauri initialises plugins inside `Builder::build()`, which no unit
          # test reaches - the suite never calls it and never expands
          # `generate_context!()`. A malformed `tauri.conf.json` therefore
          # compiles, links, packages and passes every other gate, then aborts
          # the binary about a second after a user launches it (see issue #44
          # and src-tauri/tests/tauri_config.rs). Actually starting the process
          # is the only check that covers that whole class of failure.
          $binary = "dist-build/pixelgrab.exe"
          $stderrLog = "smoke-stderr.log"
          $stdoutLog = "smoke-stdout.log"
          $proc = Start-Process -FilePath $binary -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardError $stderrLog -RedirectStandardOutput $stdoutLog
          Write-Host "Launched $binary as PID $($proc.Id)."
          # Poll instead of sleeping flat so a startup panic fails fast rather
          # than burning the whole window.
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
            if ($proc.HasExited) { break }
          }
          $proc.Refresh()
          # Read stderr before stopping the process - a forced kill can lose
          # whatever has not been flushed.
          $errText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
          Write-Host "----- stderr -----"
          Write-Host $errText
          Write-Host "------------------"
          if ($proc.HasExited) {
            # WaitForExit() flushes the exit code onto the process object;
            # without it ExitCode can come back empty on an aborted process.
            $proc.WaitForExit()
            $code = if ($null -ne $proc.ExitCode) { $proc.ExitCode } else { "unknown" }
            Write-Error "pixelgrab.exe exited with code $code during startup - it must stay running. See stderr above."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          if ($errText -notmatch "PixelGrab starting") {
            Write-Error "pixelgrab.exe stayed up but never logged its startup line - startup did not complete."
            exit 1
          }
          Write-Host "Launch smoke test passed - binary survived startup."
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            smoke-stderr.log
            smoke-stdout.log
          if-no-files-found: ignore
          retention-days: 7
