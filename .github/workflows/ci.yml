name: PixelGrab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs targeting the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 1
  PNPM_VERSION: 9.15.0
  # Force LF checkouts so all tools (cargo fmt, prettier, svelte-check)
  # see the same bytes regardless of whether the runner is on Windows or
  # Linux. .gitattributes already enforces eol=lf but the actions/checkout
  # step on Windows still defaults to CRLF unless we explicitly opt out.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.autocrlf"
  GIT_CONFIG_VALUE_0: "false"

jobs:
  install:
    name: Install (frozen)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  rust:
    name: Rust (fmt, clippy, test)
    needs: [install]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features synthetic -- -D warnings
      - name: Test
        run: cargo test --workspace --features synthetic

  frontend:
    name: Frontend (lint, typecheck, test)
    needs: [install]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm exec eslint .
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: License policy
        run: pnpm licenses:check

  build:
    name: Build (production)
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build --no-bundle
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelgrab-build
          path: |
            src-tauri/target/release/pixelgrab.exe
            src-tauri/target/release/pixelgrab_lib.lib
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Packaged-app acceptance (WebdriverIO)
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pixelgrab-build
          path: dist-build
      - name: Run WebdriverIO
        run: pnpm exec wdio run tests/e2e/wdio.conf.ts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixelgrab-e2e-failures
          path: |
            test-results/
            wdio-shared-store/
          retention-days: 3
