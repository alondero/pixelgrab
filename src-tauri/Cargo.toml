[package]
name = "pixelgrab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "PixelGrab - local-first Windows desktop capture and annotation utility"

[lib]
name = "pixelgrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pixelgrab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
indexmap = { workspace = true }

tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }

png = { workspace = true }
image = { workspace = true }

pixelgrab-contracts = { workspace = true }
pixelgrab-test-support = { workspace = true, optional = true }

# Windows-only native capture via the Windows Graphics Capture API.
# `xcap` is only compiled when targeting Windows; the synthetic feature is
# still what CI uses.
[target.'cfg(target_os = "windows")'.dependencies]
xcap = "0.7"
arboard = "3.6"

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = "3.13"
# Reused by examples/hotkey_probe.rs to validate the OS hotkey layer
# without pulling in the full Tauri runtime.
global-hotkey = "0.7"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# The `synthetic` feature remains for tests and for local development on
# non-Windows hosts. Production Windows builds run the real adapter by
# default (see `lib::default_platform`); CI runs the synthetic path so
# no real desktop session is required.
synthetic = ["dep:pixelgrab-test-support"]
default = ["synthetic"]
