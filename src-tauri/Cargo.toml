[package]
name = "pixelgrab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "PixelGrab - local-first Windows desktop capture and annotation utility"

[lib]
name = "pixelgrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pixelgrab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
indexmap = { workspace = true }

tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }

png = { workspace = true }
image = { workspace = true }

pixelgrab-contracts = { workspace = true }
pixelgrab-test-support = { workspace = true, optional = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = "3.13"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
synthetic = ["dep:pixelgrab-test-support"]
